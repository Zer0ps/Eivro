[package]
name = "eivro"
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
description = "A quiet, native proxy client for Linux and macOS"
license = "GPL-3.0-or-later"
default-run = "eivro"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui-winit", "dep:glutin", "dep:glutin-winit", "dep:winit", "dep:ksni", "dep:zbus"]
qa = ["gui", "eframe/__screenshot"]

[dependencies]
base64 = "0.22"
flate2 = "1.1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"], optional = true }
ipnet = "2.11"
libc = "0.2"
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Linux's EGL/X11 backend; macOS uses eframe's native CGL integration.
eframe = { version = "0.33", default-features = false, features = ["wayland"], optional = true }
egui-winit = { version = "0.33", default-features = false, features = ["x11"], optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl", "x11"], optional = true }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "x11"], optional = true }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"], optional = true }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }
zbus = { version = "5", optional = true }

[[bin]]
name = "eivro"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "eivro-tun"
path = "src/bin/eivro-tun.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
