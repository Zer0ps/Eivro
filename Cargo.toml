[package]
name = "eivro"
version = "1.4.1"
edition = "2024"
rust-version = "1.88"
description = "A quiet, native proxy client for Linux, macOS and Windows"
license = "GPL-3.0-or-later"
default-run = "eivro"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui-winit", "dep:glutin", "dep:glutin-winit", "dep:winit", "dep:ksni", "dep:zbus", "dep:wgpu"]
qa = ["gui", "eframe/__screenshot"]

[dependencies]
base64 = "0.22"
flate2 = "1.1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts"], optional = true }
ipnet = "2.11"
libc = "0.2"
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow"], optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "wgsl", "std"], optional = true }
eframe = { version = "0.33", default-features = false, features = ["wgpu"], optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO",
    "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services",
    "Win32_System_RestartManager",
    "Win32_System_Memory", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Console",
    "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ErrorReporting",
    "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_Networking_WinInet",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_RemoteDesktop"
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Linux's EGL/X11 backend; macOS uses eframe's native CGL integration.
eframe = { version = "0.33", default-features = false, features = ["wayland"], optional = true }
egui-winit = { version = "0.33", default-features = false, features = ["x11"], optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl", "x11"], optional = true }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "x11"], optional = true }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"], optional = true }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }
zbus = { version = "5", optional = true }

[[bin]]
name = "eivro"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "eivro-tun"
path = "src/bin/eivro-tun.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[patch.crates-io]
# Windows hidden-window/event-loop fixes; see vendor/eframe/EIVRO-PATCH.md.
eframe = { path = "vendor/eframe" }
