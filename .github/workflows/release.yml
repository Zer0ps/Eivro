name: Desktop packages

on:
  push:
    branches: [main, master, 'macos/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag against Cargo metadata
        run: python3 scripts/check-release.py
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libudev-dev \
            rpm dbus-daemon dbus-x11 dconf-cli gsettings-desktop-schemas \
            nftables iproute2 python3 curl xz-utils binutils openssl util-linux
          # Only this disposable runner: exercise nftables/capability tests inside
          # unprivileged user+network namespaces, without touching runner routes.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install pinned Rust and verified upstream binaries
        run: |
          rustup show active-toolchain
          python3 scripts/fetch-core.py
          python3 scripts/fetch-xray.py
          python3 scripts/fetch-portable-tools.py
      - name: Format, lint and test
        run: ./scripts/check.sh
      - name: Build DEB, RPM, portable and source archives
        run: ./scripts/build.sh --skip-appimage
      - name: Verify package payloads and metadata
        run: python3 scripts/verify-packages.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eivro-linux-x86_64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distribution: [debian, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eivro-linux-x86_64
          path: dist
      - name: Verify transferred artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Install and smoke test in an isolated distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: scripts/smoke-container.sh "$DISTRIBUTION"

  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-26-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: macos-26-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Check toolchain and release metadata
        run: |
          rustup show active-toolchain
          python3 scripts/check-release.py
      - name: Fetch verified macOS cores
        run: |
          python3 scripts/fetch-core.py
          python3 scripts/fetch-xray.py
      - name: Compile native bridge, lint and test
        run: |
          cargo fmt --all --check
          cargo clippy --locked --lib --bins -- -D warnings
          cargo test --locked --lib --bin eivro
          cargo test --locked --test catalog --test policy --test subscriptions --test subscription_compat --test resolver
      - name: Build application and installer
        run: ./scripts/build-macos.sh
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Verify and install in the disposable runner
        run: |
          (cd dist && shasum -a 256 -c "SHA256SUMS-macos-${{ matrix.architecture }}")
          sudo installer -pkg "dist/Eivro-$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')-macos-${{ matrix.architecture }}.pkg" -target /
          python3 scripts/smoke-macos.py
      - name: Verify native TUN and network recovery on the disposable runner
        run: |
          cargo test --locked --lib --no-run --message-format=json > work/macos-lib-tests.json
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          records = [json.loads(line) for line in Path('work/macos-lib-tests.json').read_text().splitlines()]
          binaries = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact'
                      and r.get('executable') and r['target']['kind'] == ['lib'] and r['profile']['test']]
          assert len(binaries) == 1
          subprocess.run(['sudo', 'env', 'GITHUB_ACTIONS=true', binaries[0], '--ignored', '--test-threads=1',
              'platform::macos::daemon::tests::'], check=True)
          PYTHON
      - name: Remove test installation
        if: always()
        run: |
          if [ -f /Library/PrivilegedHelperTools/io.eivro/eivro-tun ]; then
            sudo packaging/macos/uninstall.sh
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eivro-macos-${{ matrix.architecture }}
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/SHA256SUMS-macos-*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eivro-visual-macos-${{ matrix.architecture }}
          path: work/macos-smoke/*
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, install, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eivro-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eivro-macos-*
          path: dist
          merge-multiple: true
      - name: Create and publish release after every check passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release.py
          (cd dist && sha256sum --check SHA256SUMS && sha256sum --check SHA256SUMS-macos-*)
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Eivro $GITHUB_REF_NAME · macOS preview" \
            --notes-file docs/RELEASE.md \
            dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.pkg dist/*.dmg dist/SHA256SUMS*
          gh release edit "$GITHUB_REF_NAME" --draft=false
